

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOHAM SOUND - Voice Recorder</title>

  <style>
   :root {
  --brand-gradient: linear-gradient(
    110deg,
    #2463ff 0%,
    #6235ed 38%,
    #c000c8 72%,
    #ff5a36 100%
  );

  --brand-blue: #2463ff;
  --brand-purple: #6235ed;
  --brand-magenta: #c000c8;
  --brand-orange: #ff5a36;
}

body {
  background: #10111a;
}

.recorder-card {
  background: #191d2c;
  border: 1px solid #34394e;
  border-radius: 30px;
}

.mic-button {
  background: var(--brand-gradient);
  border: none;
  box-shadow: 0 10px 35px rgba(98, 53, 237, 0.35);
}

.mic-button:hover {
  filter: brightness(1.12);
  transform: scale(1.04);
}

h1 {
  background: var(--brand-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.timer {
  color: #ffffff;
}

.status-message {
  color: #b9c5e5;
}
  
  </style>
</head>

<body>
  <main class="recorder">
    <div class="brand">SOHAM SOUND</div>
    <h2>Voice Booking</h2>

    <p class="description">
      Speak your booking details in Gujarati, Hindi or English.
      Your recording will be sent to the Booking Manager for transcription.
    </p>

    <button id="startBtn" class="mic-button" type="button"
      aria-label="Start recording">🎙</button>

    <div id="indicator" class="indicator">
      <span class="dot"></span> RECORDING
    </div>

    <div id="timer" class="timer">00:00</div>

    <div id="controls" class="controls">
      <button id="stopBtn" class="action stop" type="button">
        ■ Stop
      </button>

      <button id="cancelBtn" class="action cancel" type="button">
        ✕ Cancel
      </button>
    </div>

    <div id="status" class="status" aria-live="polite">
      Tap the microphone to start recording.
    </div>

    <div class="note">
      Maximum recording duration: 3 minutes · Maximum audio size: 6 MB
    </div>
  </main>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const controls = document.getElementById('controls');
    const indicator = document.getElementById('indicator');
    const timer = document.getElementById('timer');
    const statusBox = document.getElementById('status');

    let recorder = null;
    let stream = null;
    let chunks = [];
    let seconds = 0;
    let timerInterval = null;
    let cancelRequested = false;

    function setStatus(message, color = '#b8c2d9') {
      statusBox.textContent = message;
      statusBox.style.color = color;
    }

    function formatTime(value) {
      const min = Math.floor(value / 60);
      const sec = value % 60;

      return String(min).padStart(2, '0') + ':' +
        String(sec).padStart(2, '0');
    }

    function cleanup() {
      clearInterval(timerInterval);
      timerInterval = null;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      recorder = null;
      chunks = [];

      startBtn.disabled = false;
      startBtn.style.display = 'grid';
      controls.style.display = 'none';
      indicator.style.display = 'none';
    }

    async function startRecording() {
      if (recorder) return;

      if (!navigator.mediaDevices?.getUserMedia ||
          typeof MediaRecorder === 'undefined') {
        setStatus('This browser does not support audio recording.', '#ff6675');
        return;
      }

      try {
        startBtn.disabled = true;
        setStatus('Requesting microphone permission...');

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        const formats = [
          'audio/webm;codecs=opus',
          'audio/ogg;codecs=opus',
          'audio/mp4'
        ];

        const selected = formats.find(type =>
          MediaRecorder.isTypeSupported(type)
        );

        recorder = selected
          ? new MediaRecorder(stream, { mimeType: selected })
          : new MediaRecorder(stream);

        chunks = [];
        seconds = 0;
        cancelRequested = false;
        timer.textContent = '00:00';

        recorder.ondataavailable = event => {
          if (event.data?.size > 0) chunks.push(event.data);
        };

        recorder.onstop = handleRecordingStopped;

        recorder.start(1000);

        startBtn.style.display = 'none';
        controls.style.display = 'flex';
        indicator.style.display = 'block';

        setStatus('Recording... Speak your booking details.', '#ff6675');

        timerInterval = setInterval(() => {
          seconds++;
          timer.textContent = formatTime(seconds);

          if (seconds >= 180) {
            setStatus('Maximum 3-minute recording limit reached.', '#ffad42');
            stopRecording();
          }
        }, 1000);

      } catch (error) {
        console.error('Microphone error:', error);
        cleanup();

        let message = 'Could not start microphone: ' + error.message;

        if (error.name === 'NotAllowedError' ||
            error.name === 'PermissionDeniedError') {
          message = 'Microphone permission denied. Allow microphone access in your browser.';
        }

        setStatus(message, '#ff6675');
      }
    }

    function stopRecording() {
      if (recorder && recorder.state === 'recording') {
        stopBtn.disabled = true;
        setStatus('Preparing your audio...', '#6ea3ff');
        recorder.stop();
      }
    }

    function cancelRecording() {
      if (!recorder) return;

      cancelRequested = true;

      if (recorder.state !== 'inactive') {
        recorder.stop();
      }
    }

    function handleRecordingStopped() {
      const mimeType = recorder?.mimeType || 'audio/webm';
      const audioBlob = new Blob(chunks, { type: mimeType });

      cleanup();
      stopBtn.disabled = false;

      if (cancelRequested) {
        setStatus('Recording cancelled.');
        return;
      }

      if (!audioBlob.size) {
        setStatus('No audio was recorded.', '#ff6675');
        return;
      }

      if (audioBlob.size > 6 * 1024 * 1024) {
        setStatus('Audio exceeds 6 MB. Please record a shorter message.', '#ff6675');
        return;
      }

const bookingManagerWindow = window.opener;

if (!bookingManagerWindow || bookingManagerWindow.closed) {
  setStatus(
    'Booking Manager window not found. Please reopen the recorder from Booking Manager.',
    '#ffad42'
  );
  return;
}

setStatus('Sending audio to Booking Manager...', '#6ea3ff');

try {
  bookingManagerWindow.postMessage({
  type: 'SOHAM_VOICE_AUDIO',
  blob: audioBlob,
  mimeType: mimeType
}, '*');

  setStatus(
    '✓ Audio sent successfully! Returning to Booking Manager...',
    '#36d99a'
  );

  setTimeout(() => {
    window.close();
  }, 1200);

} catch (error) {
  console.error('Audio transfer error:', error);

  setStatus(
    'Could not send audio. Please try again.',
    '#ff6675'
  );
}

    }

    startBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    cancelBtn.addEventListener('click', cancelRecording);
  </script>
</body>
</html>
