

<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOHAM SOUND - Voice Recorder</title>

  <style>
 
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap');

:root {
  --brand-gradient: linear-gradient(
    110deg,
    #2463ff 0%,
    #6235ed 38%,
    #c000c8 72%,
    #ff5a36 100%
  );

  --bg: #10111a;
  --card: #191d2c;
  --border: #34394e;
  --text: #f5f6ff;
  --muted: #aeb9d5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 40px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 35%, rgba(98, 53, 237, 0.13), transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: 'Noto Sans Gujarati', sans-serif;
}

.recorder {
  width: 100%;
  max-width: 660px;
  min-height: 710px;
  padding: 38px 34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 30px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.brand {
  margin-bottom: 14px;
  font-family: Arial, sans-serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 5px;
  background: var(--brand-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

h2 {
  margin: 0 0 18px;
  color: #ffffff;
  font-size: 34px;
  font-weight: 800;
}

.description {
  max-width: 540px;
  margin: 0 0 42px;
  color: #c2cbe2;
  font-size: 19px;
  line-height: 1.9;
}

.mic-button {
  width: 165px;
  height: 165px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 50%;
  background: var(--brand-gradient);
  color: white;
  font-size: 48px;
  cursor: pointer;
  box-shadow: 0 12px 40px rgba(98, 53, 237, 0.35);
  transition: transform 0.2s ease, filter 0.2s ease;
}

.mic-button:hover {
  transform: scale(1.05);
  filter: brightness(1.12);
}

.mic-button:disabled {
  opacity: 0.65;
  cursor: wait;
}

.indicator {
  display: none;
  margin-top: 22px;
  color: #ff718b;
  font-size: 17px;
  font-weight: 600;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 9px;
  border-radius: 50%;
  background: #ff496c;
  box-shadow: 0 0 12px #ff496c;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { opacity: 0.35; }
}

.timer {
  margin-top: 24px;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 42px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.controls {
  display: none;
  justify-content: center;
  gap: 14px;
  margin-top: 28px;
}

.action {
  min-width: 125px;
  padding: 13px 22px;
  border: none;
  border-radius: 12px;
  color: white;
  font-family: 'Noto Sans Gujarati', sans-serif;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.2s ease, transform 0.2s ease;
}

.action:hover {
  filter: brightness(1.12);
  transform: translateY(-2px);
}

.action.stop {
  background: var(--brand-gradient);
}

.action.cancel {
  background: #34394e;
  border: 1px solid #505772;
}

.action:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.note {
  margin-top: 48px;
  color: #8795b6;
  font-size: 14px;
  line-height: 1.8;
}

#status {
  min-height: 28px;
  margin-top: 22px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
}


/* LIVE AUDIO WAVEFORM */
.waveform {
  display: none;
  width: 100%;
  max-width: 510px;
  margin-top: 28px;
  padding: 16px;
  border: 1px solid #34394e;
  border-radius: 18px;
  background: #111522;
}

.waveform-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #aeb9d5;
  font-size: 13px;
  margin-bottom: 10px;
}

.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #ff718b;
  font-family: Arial, sans-serif;
  font-size: 11px;
  font-weight: bold;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff496c;
  animation: pulse 1s infinite;
}

#waveCanvas {
  display: block;
  width: 100%;
  height: 95px;
}

#waveHint {
  margin-top: 8px;
  color: #8795b6;
  font-size: 12px;
}

@media (max-width: 600px) {
  .waveform {
    padding: 12px;
    margin-top: 22px;
  }

  #waveCanvas {
    height: 75px;
  }
}

    
@media (max-width: 600px) {
  body {
    padding: 18px 12px;
  }

  .recorder {
    min-height: 650px;
    padding: 30px 20px;
    border-radius: 24px;
  }

  h2 {
    font-size: 28px;
  }

  .description {
    font-size: 16px;
    margin-bottom: 34px;
  }

  .mic-button {
    width: 145px;
    height: 145px;
  }

  .timer {
    font-size: 36px;
  }

  .action {
    min-width: 110px;
    padding: 12px 15px;
    font-size: 15px;
  }

  .note {
    margin-top: 38px;
    font-size: 13px;
  }
}
  </style>
</head>

<body>
  <main class="recorder">
    <div class="brand">SOHAM SOUND</div>
    <h2>વોઇસ બુકિંગ</h2>

    <p class="description">
      ગુજરાતી, હિન્દી અથવા અંગ્રેજીમાં બુકિંગની વિગતો રેકોર્ડ કરવા નીચેના બટન પર ક્લિક કરો .
    </p>

    <button id="startBtn" class="mic-button" type="button"
      aria-label="Start recording">🎙</button>

    <div id="indicator" class="indicator">
      <span class="dot"></span>રેકોર્ડિંગ
    </div>

    <div id="timer" class="timer">00:00</div>

    <div id="waveform" class="waveform">
  <div class="waveform-label">
    <span>લાઇવ ઑડિયો વેવફોર્મ</span>
    <span class="live-indicator">
      <span class="live-dot"></span> LIVE
    </span>
  </div>
  <canvas id="waveCanvas"></canvas>
  <div id="waveHint">તમારો અવાજ અહીં દેખાશે</div>
</div>

    <div id="controls" class="controls">
      <button id="stopBtn" class="action stop" type="button">
        ■ સ્ટોપ 
      </button>

      <button id="cancelBtn" class="action cancel" type="button">
        ✕ કેન્સલ 
      </button>
    </div>
<div id="status" role="status" aria-live="polite"></div>
    <div class="note">
      મહત્તમ રેકોર્ડિંગ સમય: ૩ મિનિટ · મહત્તમ ઑડિયો સાઇઝ: ૬ MB
    </div>
  </main>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const controls = document.getElementById('controls');
    const indicator = document.getElementById('indicator');
    const timer = document.getElementById('timer');
    const statusBox = document.getElementById('status');

    let recorder = null;
    let stream = null;
    let chunks = [];
    let seconds = 0;
    let timerInterval = null;
    let cancelRequested = false;
    let audioContext = null;
let analyser = null;
let waveformAnimationId = null;

    function setStatus(message, color = '#b8c2d9') {
      statusBox.textContent = message;
      statusBox.style.color = color;
    }

    function startWaveform(audioStream) {
  const waveform = document.getElementById('waveform');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  waveform.style.display = 'block';

  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      throw new Error('AudioContext not supported');
    }

    audioContext = new AudioContextClass();
    analyser = audioContext.createAnalyser();

    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;

    const source = audioContext.createMediaStreamSource(audioStream);
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);
    const barCount = 42;

    function draw() {
      waveformAnimationId = requestAnimationFrame(draw);

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const dpr = window.devicePixelRatio || 1;

      if (
        canvas.width !== Math.round(width * dpr) ||
        canvas.height !== Math.round(height * dpr)
      ) {
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      analyser.getByteFrequencyData(data);

      const gap = 4;
      const barWidth = (width - gap * (barCount - 1)) / barCount;
      const centerY = height / 2;

      const gradient = ctx.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, '#2463ff');
      gradient.addColorStop(0.38, '#6235ed');
      gradient.addColorStop(0.72, '#c000c8');
      gradient.addColorStop(1, '#ff5a36');

      ctx.fillStyle = gradient;

      for (let i = 0; i < barCount; i++) {
        const dataIndex = Math.floor(
          i * data.length / barCount
        );

        const value = data[dataIndex] / 255;

        const barHeight = Math.max(
          4,
          value * height * 0.9
        );

        const x = i * (barWidth + gap);
        const y = centerY - barHeight / 2;

        ctx.beginPath();
        ctx.roundRect(
          x,
          y,
          barWidth,
          barHeight,
          barWidth / 2
        );
        ctx.fill();
      }
    }

    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }

    draw();

  } catch (error) {
    console.warn('Waveform could not start:', error);
    waveform.style.display = 'none';
  }
}

function stopWaveform() {
  if (waveformAnimationId !== null) {
    cancelAnimationFrame(waveformAnimationId);
    waveformAnimationId = null;
  }

  if (audioContext) {
    audioContext.close().catch(error => {
      console.warn('AudioContext close error:', error);
    });

    audioContext = null;
    analyser = null;
  }

  const waveform = document.getElementById('waveform');

  if (waveform) {
    waveform.style.display = 'none';
  }
}

    function formatTime(value) {
      const min = Math.floor(value / 60);
      const sec = value % 60;

      return String(min).padStart(2, '0') + ':' +
        String(sec).padStart(2, '0');
    }

    function cleanup() {
  stopWaveform();

  clearInterval(timerInterval);
      timerInterval = null;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      recorder = null;
      chunks = [];

      startBtn.disabled = false;
      startBtn.style.display = 'grid';
      controls.style.display = 'none';
      indicator.style.display = 'none';
    }

    async function startRecording() {
      if (recorder) return;

      if (!navigator.mediaDevices?.getUserMedia ||
          typeof MediaRecorder === 'undefined') {
        setStatus('This browser does not support audio recording.', '#ff6675');
        return;
      }

      try {
        startBtn.disabled = true;
        setStatus('Requesting microphone permission...');

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
startWaveform(stream);
        const formats = [
          'audio/webm;codecs=opus',
          'audio/ogg;codecs=opus',
          'audio/mp4'
        ];

        const selected = formats.find(type =>
          MediaRecorder.isTypeSupported(type)
        );

        recorder = selected
          ? new MediaRecorder(stream, { mimeType: selected })
          : new MediaRecorder(stream);

        chunks = [];
        seconds = 0;
        cancelRequested = false;
        timer.textContent = '00:00';

        recorder.ondataavailable = event => {
          if (event.data?.size > 0) chunks.push(event.data);
        };

        recorder.onstop = handleRecordingStopped;

        recorder.start(1000);

        startBtn.style.display = 'none';
        controls.style.display = 'flex';
        indicator.style.display = 'block';

        setStatus('રેકોર્ડિંગ થઈ રહ્યું છે... તમારી બુકિંગ વિગતો રેકોર્ડ કરો.', '#ff6675');

        timerInterval = setInterval(() => {
          seconds++;
          timer.textContent = formatTime(seconds);

          if (seconds >= 180) {
            setStatus('Maximum 3-minute recording limit reached.', '#ffad42');
            stopRecording();
          }
        }, 1000);

      } catch (error) {
        console.error('Microphone error:', error);
        cleanup();

        let message = 'Could not start microphone: ' + error.message;

        if (error.name === 'NotAllowedError' ||
            error.name === 'PermissionDeniedError') {
          message = 'Microphone permission denied. Allow microphone access in your browser.';
        }

        setStatus(message, '#ff6675');
      }
    }

    function stopRecording() {
      if (recorder && recorder.state === 'recording') {
        stopBtn.disabled = true;
        setStatus('Preparing your audio...', '#6ea3ff');
        recorder.stop();
      }
    }

    function cancelRecording() {
      if (!recorder) return;

      cancelRequested = true;

      if (recorder.state !== 'inactive') {
        recorder.stop();
      }
    }

    function handleRecordingStopped() {
      const mimeType = recorder?.mimeType || 'audio/webm';
      const audioBlob = new Blob(chunks, { type: mimeType });

      cleanup();
      stopBtn.disabled = false;

      if (cancelRequested) {
        setStatus('Recording cancelled.');
        return;
      }

      if (!audioBlob.size) {
        setStatus('No audio was recorded.', '#ff6675');
        return;
      }

      if (audioBlob.size > 6 * 1024 * 1024) {
        setStatus('Audio exceeds 6 MB. Please record a shorter message.', '#ff6675');
        return;
      }

const bookingManagerWindow = window.opener;

if (!bookingManagerWindow || bookingManagerWindow.closed) {
  setStatus(
    'Booking Manager window not found. Please reopen the recorder from Booking Manager.',
    '#ffad42'
  );
  return;
}

setStatus('ઓડિયો રેકોર્ડ થઇ ગયો છે ...', '#6ea3ff');

try {
  bookingManagerWindow.postMessage({
  type: 'SOHAM_VOICE_AUDIO',
  blob: audioBlob,
  mimeType: mimeType
}, '*');

  setStatus(
    '✓ ઓડિયો સફળતાપૂર્વક રેકોર્ડ થયો...',
    '#36d99a'
  );

  setTimeout(() => {
    window.close();
  }, 1200);

} catch (error) {
  console.error('Audio transfer error:', error);

  setStatus(
    'કૃપા કરીને ફરી પ્રયાસ કરો.',
    '#ff6675'
  );
}

    }

    startBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    cancelBtn.addEventListener('click', cancelRecording);

    
// Automatically start recording when opened from Booking Manager.
window.addEventListener('load', () => {
  if (window.opener && !window.opener.closed) {
    setStatus('Connecting to microphone...', '#6ea3ff');

    startRecording();
  } else {
    setStatus(
      'રેકોર્ડિંગ શરૂ કરવા માઇક્રોફોન બટન દબાવો.',
      '#b8c2d9'
    );
  }
});

  </script>
</body>
</html>
